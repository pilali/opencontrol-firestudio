name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Versions
        run: |
          sw_vers
          xcodebuild -version
          swiftc --version
          echo "VERSION=$(cat VERSION)" >> "$GITHUB_ENV"

      - name: Tag et fichier VERSION cohérents
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test "${GITHUB_REF_NAME#v}" = "$VERSION" || { echo "Tag $GITHUB_REF_NAME ≠ VERSION $VERSION"; exit 1; }

      - name: Application (Universal Binary)
        run: make -C app ARCHS="x86_64 arm64" BUILD=${{ github.run_number }}

      - name: Vérifier les architectures
        run: |
          archs="$(lipo -archs "app/build/FireStudio Mixer.app/Contents/MacOS/FireStudioMixer")"
          echo "$archs"
          [[ "$archs" == *x86_64* && "$archs" == *arm64* ]]

      - name: Paquets
        run: make -C app pkg zip ARCHS="x86_64 arm64" BUILD=${{ github.run_number }}

      - name: Outils de sonde et script d'installeur
        run: |
          make -C tools/probe
          bash -n installer/build-installer.sh
          xmllint --noout installer/Distribution.xml

      - uses: actions/upload-artifact@v4
        with:
          name: OpenControl-FireStudio-${{ env.VERSION }}-${{ github.run_number }}
          path: |
            app/build/OpenControl-FireStudio-*-app.pkg
            app/build/OpenControl-FireStudio-*-app.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: OpenControl for PreSonus FireStudio ${{ env.VERSION }}
          body: |
            Application **FireStudio Mixer** (Universal Binary x86_64 + arm64), non notarisée : clic droit › Ouvrir au premier lancement.

            Ces fichiers **ne contiennent pas** les drivers PreSonus. Pour un installeur complet (drivers + application),
            voir la section « Installation A » du README : `installer/build-installer.sh <installeur Universal Control 3.4.2>`.
          files: |
            app/build/OpenControl-FireStudio-*-app.pkg
            app/build/OpenControl-FireStudio-*-app.zip

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Versions
        run: |
          sw_vers
          xcodebuild -version
          swiftc --version
          echo "VERSION=$(cat VERSION)" >> "$GITHUB_ENV"

      - name: Tag matches the VERSION file
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test "${GITHUB_REF_NAME#v}" = "$VERSION" || { echo "Tag $GITHUB_REF_NAME does not match VERSION $VERSION"; exit 1; }

      - name: Localization check
        run: python3 tools/check_l10n.py

      - name: App (Universal Binary)
        run: make -C app ARCHS="x86_64 arm64" BUILD=${{ github.run_number }}

      - name: Check architectures
        run: |
          archs="$(lipo -archs "app/build/FireStudio Mixer.app/Contents/MacOS/FireStudioMixer")"
          echo "$archs"
          [[ "$archs" == *x86_64* && "$archs" == *arm64* ]]

      - name: Packages
        run: make -C app pkg zip ARCHS="x86_64 arm64" BUILD=${{ github.run_number }}

      - name: Probe tools and installer script
        run: |
          make -C tools/probe
          bash -n installer/build-installer.sh
          xmllint --noout installer/Distribution.xml
          plutil -lint installer/resources/*.lproj/Localizable.strings

      - uses: actions/upload-artifact@v4
        with:
          name: OpenControl-FireStudio-${{ env.VERSION }}-${{ github.run_number }}
          path: |
            app/build/OpenControl-FireStudio-*-app.pkg
            app/build/OpenControl-FireStudio-*-app.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: OpenControl for PreSonus FireStudio ${{ env.VERSION }}
          body: |
            **FireStudio Mixer** app (Universal Binary x86_64 + arm64), not notarized: right-click › Open on first launch.

            These files **do not contain** the PreSonus drivers. For a full installer (drivers + app),
            see "Installation A" in the README: `installer/build-installer.sh <Universal Control 3.4.2 installer>`.
          files: |
            app/build/OpenControl-FireStudio-*-app.pkg
            app/build/OpenControl-FireStudio-*-app.zip
